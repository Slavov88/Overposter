name: Build and verify
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-extra texlive-pictures texlive-fonts-recommended
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: xelatex --version && xdvipdfmx --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:collab:e2e
      - run: pnpm examples:build
      - run: python scripts/check_qr.py .overposter/builds/sample-ml-poster.pdf examples/sample-ml-poster/poster.json
      - uses: actions/upload-artifact@v4
        with:
          name: overposter-example-pdfs
          path: .overposter/builds/*.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: overposter-preflight-reports
          path: .overposter/builds/*.preflight.json
